<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pannello di Comando Fratello GPT (VPT)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; background: white; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
        .chat-header { background-color: #4CAF50; color: white; padding: 15px; text-align: center; font-size: 1.2em; }
        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; background-color: #e9ebee; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 18px; max-width: 80%; }
        .user-message { background-color: #DCF8C6; margin-left: auto; text-align: right; }
        .ai-message { background-color: #FFFFFF; text-align: left; }
        .chat-input { display: flex; border-top: 1px solid #ccc; padding: 10px; }
        .chat-input input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; margin-right: 10px; }
        .chat-input button { background-color: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Pannello di Comando Fratello GPT (VPT)</div>
        <div class="chat-messages" id="messages">
            <div class="message ai-message">fratello, sono in attesa dei tuoi comandi.</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Scrivi il tuo comando..." disabled>
            <button onclick="sendMessage()" id="sendButton" disabled>Invia</button>
        </div>
    </div>

    <script>
        const API_URL = '/api/chat'; // Questo chiama il server.js su Vercel
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        // Attiva l'input quando la pagina è pronta
        userInput.disabled = false;
        sendButton.disabled = false;

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // 1. Aggiungi il messaggio dell'utente
            appendMessage(message, 'user-message');
            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;

            // 2. Aggiungi il messaggio di caricamento
            const loadingMessage = appendMessage('...', 'ai-message');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message }),
                });

                if (!response.ok) {
                    throw new Error(`Errore di rete: ${response.status} - Impossibile contattare il server segreto.`);
                }

                const data = await response.json();
                const aiResponse = data.response;

                // 3. Rimuovi caricamento e aggiungi la risposta
                loadingMessage.remove();
                appendMessage(aiResponse, 'ai-message');

            } catch (error) {
                console.error('Errore:', error);
                loadingMessage.remove();
                appendMessage(`Errore di connessione: Il Ponte Segreto (server.js) non è attivo. Prova a ricaricare la pagina.`, 'ai-message');
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        function appendMessage(text, className) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${className}`;
            messageElement.textContent = text;
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return messageElement;
        }
    </script>
</body>
</html>
